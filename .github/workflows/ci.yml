name: Controles

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  controles:
    name: Tests, contenu et empaquetage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Installer Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # vendor/ est commite. On le regenere ici — et seulement ici, sur le meme
      # systeme que celui ou il est produit — pour attraper un vendor/ perime,
      # qui livrerait a l'eleve une bibliotheque differente de celle du depot.
      - name: Verifier que vendor/ correspond aux sources
        run: |
          npm run vendor
          if [ -n "$(git status --porcelain vendor app/js/icones-generees.js)" ]; then
            echo "vendor/ ou les icones generees ne correspondent pas aux sources :"
            git status --porcelain vendor app/js/icones-generees.js
            echo "Lancer 'npm run vendor' puis commiter le resultat."
            exit 1
          fi

      # L'application s'execute reellement pendant ces controles : c'est ce
      # qui les rend utiles. Une lecon dont la solution ne passe pas, ou une
      # couleur illisible, sont attrapees ici.
      # La configuration Windows se controle depuis Linux, sans rien
      # construire : c'est ce qui manquait quand un nom de fichier fautif est
      # passe jusqu'au runner Windows.
      - name: Controler la configuration d empaquetage
        run: npm run check:empaquetage

      - name: Controler le contenu des 86 lecons
        run: npm run check:content

      - name: Tests de l application
        run: npm test

      # Le dernier filet : l'application EMPAQUETEE se lance et fonctionne.
      # C'est ici qu'on decouvre qu'un fichier manque dans le paquet.
      - name: Verifier l application empaquetee
        run: npm run test:paquet
