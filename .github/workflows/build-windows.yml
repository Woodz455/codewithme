name: Construire l'application Windows

# Deux facons de declencher :
#   - a la main, depuis l'onglet Actions ;
#   - en poussant une etiquette commencant par « v » — c'est exactement le
#     declencheur declare ci-dessous —, ce qui publie en plus une Release avec
#     les fichiers a telecharger. Enoncer la regle plutot qu'un exemple evite
#     d'avoir a corriger ce commentaire a chaque version.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Installateur et version portable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installe aussi les dependances de developpement, dont
      # electron-builder et les paquets qui servent a fabriquer vendor/.
      - name: Installer les dependances
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # vendor/ est commite et sert tel quel. On ne le regenere PAS ici :
      # la sortie d'esbuild et les fins de ligne peuvent differer d'un systeme
      # a l'autre, et un diff parasite bloquerait la publication. C'est le
      # controle Linux (ci.yml) qui verifie que vendor/ est a jour.
      # En premier, et en une seconde : une configuration d'empaquetage
      # fautive echouait jusqu'ici tout a la fin, apres cinq minutes de
      # runner et une application deja empaquetee pour rien.
      - name: Controler la configuration d empaquetage
        run: npm run check:empaquetage

      - name: Controler l iconographie et les couleurs
        run: |
          npm run check:icones
          npm run check:contrast

      - name: Construire l installateur et la version portable
        run: npm run build:win

      # On verifie que les deux fichiers existent VRAIMENT et sont de taille
      # plausible, plutot que de se fier au code de retour d'electron-builder.
      #
      # La verification vit dans un script du depot, pas ici : sa version
      # ecrite en ligne a fait echouer une construction pourtant reussie, et
      # aucun test ne pouvait l'attraper puisqu'elle n'existait que dans ce
      # fichier. `npm run test:script-paquet` l'eprouve maintenant sur six cas.
      - name: Verifier les fichiers produits
        shell: bash
        run: bash tools/verifier-paquet-windows.sh dist

      # Meme si la verification echoue : on veut pouvoir regarder ce qui a
      # ete produit, plutot que de relancer une construction a l'aveugle.
      - name: Deposer les fichiers en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeWithMe-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          retention-days: 30

      - name: Publier la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
          # GitHub ajoute la liste des changements sous ce texte. Le corps
          # ci-dessous reste donc volontairement general : il explique comment
          # installer, ce qui ne change pas d'une version a l'autre, tandis que
          # « ce qui est nouveau » est genere et ne peut pas devenir faux.
          generate_release_notes: true
          body: |
            ## CodeWithMe — apprendre a coder

            Deux facons de l'installer :

            - **CodeWithMe-Setup.exe** — l'installateur. Il cree un raccourci sur
              le bureau et dans le menu Demarrer. Aucun mot de passe administrateur
              n'est demande.
            - **CodeWithMe-portable.exe** — aucune installation. A garder sur une
              cle USB, ou a utiliser sur un ordinateur ou l'installation est bloquee.

            ### « Windows a protege votre ordinateur »

            Cet ecran bleu apparait parce que l'application n'est pas signee par un
            certificat commercial. Ce n'est pas un avertissement de virus.

            Cliquer sur **Informations complementaires**, puis sur
            **Executer quand meme**. Cela ne sera demande qu'une fois.
